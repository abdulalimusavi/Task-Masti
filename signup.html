<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task//Masti — Sign Up</title>
    <meta name="description" content="Create your Task//Masti account — Terminal-Style Developer To-Do Console">
    <meta name="robots" content="noindex">

    <link rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='%2305070a'/%3E%3Ctext x='50' y='66' font-size='58' text-anchor='middle' fill='%235ff0ff' font-family='monospace'%3E%3C/%3E%3C/text%3E%3C/svg%3E">

    <link rel="stylesheet" href="style.css">
    <style>
        .auth-container {
            position: relative;
            z-index: 2;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .auth-card {
            width: 100%;
            max-width: 420px;
            background: linear-gradient(180deg, var(--panel-2), var(--panel));
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 40px;
            box-shadow: 0 18px 40px -24px rgba(0, 0, 0, .7);
        }

        .auth-header {
            margin-bottom: 36px;
            text-align: center;
        }

        .auth-brand {
            font-family: var(--mono);
            font-weight: 800;
            font-size: 32px;
            margin-bottom: 8px;
            letter-spacing: -0.01em;
            color: #f1f7fb;
        }

        .auth-brand .accent {
            color: var(--accent);
            text-shadow: 0 0 18px rgba(95, 240, 255, .35);
        }

        .auth-subtitle {
            color: var(--muted);
            font-size: 13px;
            font-family: var(--mono);
            letter-spacing: .05em;
        }

        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group label {
            font-family: var(--mono);
            font-size: 10.5px;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: .1em;
        }

        .form-group input {
            width: 100%;
            background: var(--bg-grid);
            border: 1px solid var(--border);
            color: var(--text);
            font-family: var(--sans);
            font-size: 14.5px;
            padding: 11px 13px;
            border-radius: var(--radius-sm);
            outline: none;
            transition: border-color .2s, box-shadow .2s, background .2s;
        }

        .form-group input::placeholder {
            color: var(--muted-2);
        }

        .form-group input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(95, 240, 255, .12);
            background: #0b121b;
        }

        .form-group input.error {
            border-color: var(--danger);
        }

        .btn-submit {
            font-family: var(--mono);
            font-weight: 700;
            font-size: 13px;
            letter-spacing: .04em;
            border-radius: var(--radius-sm);
            border: none;
            padding: 11px 20px;
            cursor: pointer;
            background: linear-gradient(135deg, var(--accent), #2bb6c9);
            color: #001217;
            box-shadow: 0 8px 24px -8px rgba(95, 240, 255, .55);
            transition: transform .15s ease, box-shadow .2s ease, filter .2s ease;
            width: 100%;
            margin-top: 8px;
        }

        .btn-submit:hover {
            filter: brightness(1.08);
            box-shadow: 0 10px 28px -8px rgba(95, 240, 255, .7);
        }

        .btn-submit:active {
            transform: scale(.96);
        }

        .btn-submit.loading {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .auth-footer {
            margin-top: 24px;
            text-align: center;
            font-family: var(--mono);
            font-size: 12px;
            color: var(--muted);
        }

        .auth-footer a {
            color: var(--accent);
            text-decoration: none;
            transition: color .2s;
        }

        .auth-footer a:hover {
            color: #2bb6c9;
        }

        .error-message {
            background: rgba(255, 93, 108, .1);
            border: 1px solid var(--danger);
            color: var(--danger);
            padding: 10px 12px;
            border-radius: var(--radius-sm);
            font-family: var(--mono);
            font-size: 12px;
            display: none;
            margin-top: 4px;
        }

        .error-message.show {
            display: block;
        }

        .success-message {
            background: rgba(109, 255, 176, .1);
            border: 1px solid var(--ok);
            color: var(--ok);
            padding: 10px 12px;
            border-radius: var(--radius-sm);
            font-family: var(--mono);
            font-size: 12px;
            display: none;
            margin-top: 4px;
        }

        .success-message.show {
            display: block;
        }

        .loading-spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(95, 240, 255, .3);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin .8s linear infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>

<body>
    <canvas id="bg-canvas"></canvas>
    <div class="bg-circuit"></div>
    <div class="bg-scanlines"></div>
    <div class="bg-vignette"></div>

    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-brand">Task<span class="accent">//</span>Masti</div>
                <div class="auth-subtitle">CREATE YOUR ACCOUNT</div>
            </div>

            <form class="auth-form" id="signUpForm">
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" placeholder="Your name" required>
                    <div class="error-message" id="nameError"></div>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="you@example.com" required>
                    <div class="error-message" id="emailError"></div>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                    <div class="error-message" id="passwordError"></div>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" placeholder="••••••••" required>
                    <div class="error-message" id="confirmError"></div>
                </div>

                <div class="error-message" id="formError"></div>
                <div class="success-message" id="successMessage"></div>

                <button type="submit" class="btn-submit" id="submitBtn">Create Account</button>
            </form>

            <div class="auth-footer">
                Already have an account? <a href="signin.html">Sign in here</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
    <script src="supabase.js"></script>

    <script>
        (() => {
            'use strict';

            const DOM = {
                form: document.getElementById('signUpForm'),
                nameInput: document.getElementById('name'),
                emailInput: document.getElementById('email'),
                passwordInput: document.getElementById('password'),
                confirmPasswordInput: document.getElementById('confirmPassword'),
                submitBtn: document.getElementById('submitBtn'),
                nameError: document.getElementById('nameError'),
                emailError: document.getElementById('emailError'),
                passwordError: document.getElementById('passwordError'),
                confirmError: document.getElementById('confirmError'),
                formError: document.getElementById('formError'),
                successMessage: document.getElementById('successMessage'),
                bgCanvas: document.getElementById('bg-canvas')
            };

            // Background animation (falling code rain)
            const glyphs = '01{}[]<>/=+-*;:_#$%&アイウエオ010101'.split('');
            const bgCtx = DOM.bgCanvas.getContext('2d');
            let bgW, bgH, columns, drops;

            function resizeBg() {
                bgW = DOM.bgCanvas.width = window.innerWidth;
                bgH = DOM.bgCanvas.height = window.innerHeight;
                const fontSize = 15;
                columns = Math.floor(bgW / fontSize);
                drops = new Array(columns).fill(0).map(() => Math.random() * -50);
            }
            resizeBg();
            window.addEventListener('resize', resizeBg);

            function drawRain() {
                bgCtx.fillStyle = 'rgba(5,7,10,0.08)';
                bgCtx.fillRect(0, 0, bgW, bgH);
                bgCtx.font = '14px JetBrains Mono, monospace';
                for (let i = 0; i < columns; i++) {
                    const text = glyphs[Math.floor(Math.random() * glyphs.length)];
                    const x = i * 15;
                    const y = drops[i] * 18;
                    const grad = Math.random() < 0.012;
                    bgCtx.fillStyle = grad ? 'rgba(180,140,255,0.55)' : 'rgba(95,240,255,0.16)';
                    bgCtx.fillText(text, x, y);
                    if (y > bgH && Math.random() > 0.975) { drops[i] = 0; }
                    drops[i]++;
                }
                requestAnimationFrame(drawRain);
            }
            requestAnimationFrame(drawRain);

            // Form handling
            function clearErrors() {
                DOM.nameError.classList.remove('show');
                DOM.emailError.classList.remove('show');
                DOM.passwordError.classList.remove('show');
                DOM.confirmError.classList.remove('show');
                DOM.formError.classList.remove('show');
                DOM.successMessage.classList.remove('show');
            }

            function showError(field, message) {
                if (field === 'name') {
                    DOM.nameInput.classList.add('error');
                    DOM.nameError.textContent = message;
                    DOM.nameError.classList.add('show');
                } else if (field === 'email') {
                    DOM.emailInput.classList.add('error');
                    DOM.emailError.textContent = message;
                    DOM.emailError.classList.add('show');
                } else if (field === 'password') {
                    DOM.passwordInput.classList.add('error');
                    DOM.passwordError.textContent = message;
                    DOM.passwordError.classList.add('show');
                } else if (field === 'confirm') {
                    DOM.confirmPasswordInput.classList.add('error');
                    DOM.confirmError.textContent = message;
                    DOM.confirmError.classList.add('show');
                } else if (field === 'form') {
                    DOM.formError.textContent = message;
                    DOM.formError.classList.add('show');
                }
            }

            function setLoading(loading) {
                DOM.submitBtn.disabled = loading;
                DOM.submitBtn.classList.toggle('loading', loading);
                if (loading) {
                    DOM.submitBtn.innerHTML = '<span class="loading-spinner"></span>Creating account...';
                } else {
                    DOM.submitBtn.textContent = 'Create Account';
                }
            }

            DOM.form.addEventListener('submit', async (e) => {
                e.preventDefault();
                clearErrors();

                const name = DOM.nameInput.value.trim();
                const email = DOM.emailInput.value.trim();
                const password = DOM.passwordInput.value;
                const confirmPassword = DOM.confirmPasswordInput.value;

                // Validation
                if (!name) {
                    showError('name', 'Name is required');
                    DOM.nameInput.focus();
                    return;
                }

                if (!email) {
                    showError('email', 'Email is required');
                    DOM.emailInput.focus();
                    return;
                }

                if (!password) {
                    showError('password', 'Password is required');
                    DOM.passwordInput.focus();
                    return;
                }

                if (password.length < 8) {
                    showError('password', 'Password must be at least 8 characters');
                    return;
                }

                if (password !== confirmPassword) {
                    showError('confirm', 'Passwords do not match');
                    DOM.confirmPasswordInput.focus();
                    return;
                }

                setLoading(true);

                try {
                    const { data, error } = await AuthHelper.signUp(email, password, name);

                    if (error) {
                        if (error.message.includes('already registered')) {
                            showError('email', 'This email is already registered');
                        } else if (error.message.includes('password')) {
                            showError('password', error.message);
                        } else {
                            showError('form', error.message || 'Sign up failed');
                        }
                        setLoading(false);
                        return;
                    }

                    // Success
                    DOM.successMessage.textContent = 'Account created! Redirecting to sign in...';
                    DOM.successMessage.classList.add('show');
                    DOM.form.style.opacity = '0.5';
                    DOM.form.style.pointerEvents = 'none';

                    setTimeout(() => {
                        window.location.href = 'signin.html';
                    }, 2000);

                } catch (err) {
                    showError('form', 'An unexpected error occurred');
                    setLoading(false);
                }
            });

            // Remove error styling on input
            [DOM.nameInput, DOM.emailInput, DOM.passwordInput, DOM.confirmPasswordInput].forEach(input => {
                input.addEventListener('focus', () => {
                    input.classList.remove('error');
                });
            });
        })();
    </script>
</body>

</html>
